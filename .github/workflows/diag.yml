name: diag

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev
      - name: probe
        env:
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_PAGES: '2'
          BLOCK_RESOURCES: '2'
        run: node diag/probe.mjs
