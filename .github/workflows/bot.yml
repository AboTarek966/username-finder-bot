# Runs the Telegram bot 24/7 on GitHub's own runners - completely free,
# no credit card, no server. GitHub caps a single job at 6 hours, so the
# workflow is scheduled every 6 hours: when one run hits the cap the next
# one starts right away (the bot is back within a minute or two).
#
# Setup (once):
#   1. Push this project to a PUBLIC repo (public = unlimited free minutes).
#   2. Repo -> Settings -> Secrets and variables -> Actions -> New secret
#      Name: TELEGRAM_BOT_TOKEN   Value: the token from @BotFather
#   3. Repo -> Actions -> enable workflows, then "Run workflow" to start now.

name: Run bot

on:
  schedule:
    - cron: '0 */6 * * *' # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch: {} # manual start button

# Never two bots at once (a manual run while a scheduled one is live).
concurrency:
  group: username-finder
  cancel-in-progress: false

permissions:
  contents: write # needed for the keep-alive commit below

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub's hard limit: 6 hours per job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional: Instagram redirects every datacenter IP to its login
          # wall, so from a server it can only answer "unknown" unless the
          # bot is logged in. Secret IG_SESSION = the "sessionid" cookie
          # value of a (spare) account. Nothing breaks when it is unset.
          IG_SESSION: ${{ secrets.IG_SESSION }}
          # Google Chrome is preinstalled on GitHub's Ubuntu runners.
          BROWSER_PATH: /usr/bin/google-chrome
          BROWSER_PAGES: '6'
          CHECK_PARALLEL: '5'
          BLOCK_RESOURCES: '2'
        run: |
          # Keep the bot alive for the whole 6h window:
          #   - a crash (e.g. one stray 409 conflict) restarts after 5s
          #   - every instance is recycled after 4h50m so a silently stuck
          #     process can never waste the rest of the window
          set +e
          while true; do
            timeout -s TERM 17400 node src/index.js
            code=$?
            echo "bot process ended (exit $code) - restarting in 5s"
            sleep 5
          done

      # GitHub disables scheduled workflows in repos with no activity for 60
      # days - this tiny commit counts as activity and shows the last run.
      - name: Keep the repo alive
        if: always()
        run: |
          git config user.name "bot-updater"
          git config user.email "bot@users.noreply.github.com"
          date -u +"last run: %Y-%m-%d %H:%M:%S UTC" > last-run.txt
          git add last-run.txt
          # The warm inventory is saved to data/inventory.json - committing it
          # means the next 6h run starts with names already on hand instead of
          # making the user wait. (-f: data/ is ignored for local work.)
          git add -f data/inventory.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: keep scheduled workflow active"
          # The remote may have moved (someone pushed while we ran) - rebase first.
          git pull --rebase origin main || true
          git push || { git pull --rebase origin main && git push; }
